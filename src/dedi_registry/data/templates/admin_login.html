{% extends "base.html" %}
{% block header_search %}{% endblock %}
{% block content %}
  <div class="form-panel">
    <h1>Administrator sign in</h1>

    {% if error %}
      <div class="notice" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ login_action }}">
      {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
      {% endif %}

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <input type="hidden" name="csrftoken" value="{{ request.scope.csrftoken() }}">

      <button type="submit" class="button button--primary button--wide">Sign in</button>
    </form>
  </div>

{% endblock %}
