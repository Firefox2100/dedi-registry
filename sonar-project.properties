sonar.projectKey=Firefox2100_dedi-registry
sonar.organization=firefox2100

sonar.projectName=Decentralised Discovery Network Registry

sonar.sources=src
sonar.tests=tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Python coverage cannot measure browser JavaScript or the one-line ASGI entry point
sonar.coverage.exclusions=src/dedi_registry/data/static/**,src/dedi_registry/asgi.py
