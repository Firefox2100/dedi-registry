[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dedi-registry"
authors = [
  { name="Firefox2100", email="wangyunze16@gmail.com" },
]
description = "Decentralised Discovery Network Registry"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "apscheduler~=3.11.3",
    "argon2-cffi~=25.1.0",
    "asgi-csrf~=0.11",
    "cryptography~=50.0.2",
    "fastapi~=0.161.1",
    "httpx~=0.28.1",
    "itsdangerous~=2.2.0",
    "jinja2~=3.1.6",
    "jsonpatch~=1.36",
    "prometheus-client~=0.26.0",
    "pyaml~=26.7.0",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.15.0",
    "pymongo~=4.18.3",
    "python-multipart~=0.0.32",
    "redis~=8.1.0",
    "rich~=15.0.0",
    "typer~=0.27.3",
    "uvicorn~=0.54.0",
]
dynamic = [
    "version"
]

[project.optional-dependencies]
test = [
    "asgi-lifespan~=2.1.0",
    "beautifulsoup4~=4.15.0",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pylint~=4.1.3",
]

[project.urls]
Homepage = "https://github.com/Firefox2100/dedi-registry"
Repository = "https://github.com/Firefox2100/dedi-registry.git"
Issues = "https://github.com/Firefox2100/dedi-registry/issues"

[tool.setuptools.dynamic]
version = {attr = "dedi_registry.__version__"}

[tool.setuptools.package-data]
dedi_registry = ["data/**/*"]

[project.scripts]
dedi-registry = "dedi_registry.app:main"
dedi-registry-cli = "dedi_registry.cli:cli_main"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_mode = "auto"
